name: CI

# Manual-only: hosted GitHub CI is unavailable under the project cost policy.
"on":
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-scaffold:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Validate scaffold
        shell: sh
        run: sh scripts/check.sh
